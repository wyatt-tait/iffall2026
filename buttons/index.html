<!DOCTYPE html>
<html>
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons &mdash; Wyatt Tait</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Montserrat' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu:700' rel='stylesheet' type='text/css'>
		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" 
        <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css?family=Anton|Inter:500|Libre+Franklin:700" rel="stylesheet" type="text/css">
        <link href="https://fonts.googleapis.com/css?family=Archivo+Black" rel="stylesheet" type="text/css">
		 <link href="css/styles.css" rel="stylesheet">
		
	    </head>
	<body>
		
		<main>

			<h1>Button Styling &mdash; Wyatt Tait</h1>
			
			<div class="button_container">
				<a href="http://www.spotify.com" target="_blank" id="btn_spotify">Spotify</a>
			</div>

			<div class="button_container">
				<a href="http://www.amazon.com" target="_blank" id="btn_amazon"><i class="fa fa-amazon"></i></a>
			</div>

			<div class="button_container">
				<a href="http://www.twitter.com" target="_blank" id="btn_twitter">twitter</a>
			</div>

			<div class="button_container">
				<a href="http://www.indiegogo.com" target="_blank" id="btn_indiegogo"><span>indiegogo</span></a>
			</div>

            <div class="button_container">
                <a href="https://www.npr.org/" target="_blank" id="btn_npr"><span>n</span><span>p</span><span>r</span></a>
            </div>

            <div class="button_container">
                <a href="http://www.apple.com/" target="_blank" id="btn_apple"><i class="fa fa-apple"></i>Apple</a>
            </div>

            <div class="button_container center">
                <a href="http://www.cartoonnetwork.com/" target="_blank" id="btn_cn"><span class="part part_c"><span class="first">C</span><span class="rest">artoon</span></span><span class="part part_n"><span class="first">N</span><span class="rest">etwork</span></span></a>
            </div>

            <div class="button_container">
                 <a href="http://www.newyorker.com/" target="_blank" id="btn_newyorker"><span class="the">The</span>New Yorker</a>
            </div>

            <div class="button_container">
                <a href="https://oldnavy.gap.com/" target="_blank" id="btn_oldnavy">Old Navy</a>
            </div>

		</main>	

	</body>
</html>
